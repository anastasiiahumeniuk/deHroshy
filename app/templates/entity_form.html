{% extends "base.html" %}
{% block title %}{{ title }} · deHroshy{% endblock %}
{% block content %}
<header class="page-header"><div><h1>{{ title }}</h1><p>Update the details below.</p></div></header>
<section class="panel form-panel narrow">
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form class="stacked-form" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% for field in fields %}<label>{{ field.label }}<input type="text" name="{{ field.name }}" value="{{ field.value }}" required></label>{% endfor %}
        <div class="form-actions"><a class="button secondary" href="{{ cancel_url }}">Cancel</a><button class="button primary" type="submit">Save changes</button></div>
    </form>
</section>
{% endblock %}
