<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}deHroshy{% endblock %}</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/styles.css') }}">
</head>
<body class="{% if not current_user %}auth-body{% endif %}">
<svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
    <symbol id="icon-records" viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M15 3.5v4h3M9 11h6M9 15h6"/></symbol>
    <symbol id="icon-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 15h3"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M5 20V10M10 20V4M15 20v-7M20 20V7"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="m6 10 6-6 6 6M12 4v16"/></symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="m6 14 6 6 6-6M12 20V4"/></symbol>
    <symbol id="icon-equals" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>
{% if current_user %}
<aside class="sidebar">
    <a class="brand" href="/ui/dashboard">deHroshy</a>
    <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/ui/dashboard">
            <svg class="icon nav-icon" aria-hidden="true"><use href="#icon-home"></use></svg><span>Dashboard</span>
        </a>
        <a class="nav-link {% if active_page == 'records' %}active{% endif %}" href="/ui/monthly-records">
            <svg class="icon nav-icon" aria-hidden="true"><use href="#icon-records"></use></svg><span>Monthly Records</span>
        </a>
        <a class="nav-link {% if active_page == 'accounts' %}active{% endif %}" href="/ui/accounts">
            <svg class="icon nav-icon" aria-hidden="true"><use href="#icon-card"></use></svg><span>Accounts</span>
        </a>
        <a class="nav-link {% if active_page == 'categories' %}active{% endif %}" href="/ui/categories">
            <svg class="icon nav-icon" aria-hidden="true"><use href="#icon-chart"></use></svg><span>Categories</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <span class="user-email" title="{{ current_user.email }}">{{ current_user.email }}</span>
        <form method="post" action="/ui/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="logout-button" type="submit"><svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg> Logout</button>
        </form>
    </div>
</aside>
<main class="app-main">
    {% block content %}{% endblock %}
</main>
{% else %}
<main class="auth-main">
    {% block auth_content %}{% endblock %}
</main>
{% endif %}
</body>
</html>
