[project]
name = "dehroshy"
version = "0.1.0"
description = ""
authors = [
    {name = "Anastasiia",email = "anastasiia.humeniuk.shi.2024@lpnu.ua"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.157.0,<0.158.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.20,<1.0.0)",
    "typer (>=0.28.0,<0.29.0)",
]

[project.scripts]
dehroshy = "app.cli:app"

[tool.poetry]
packages = [
    { include = "app" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
